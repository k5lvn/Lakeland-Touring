name: Validate and publish SEO and tracking corrections
on:
  push:
    branches: [main]
    paths: ['tracking-release-20261020/**', '.github/workflows/tracking-release-20261020.yml']
permissions:
  contents: read
concurrency:
  group: tracking-release-touring-20261020
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned validation tools
        run: |
          python3 -m pip -q install paramiko==3.5.1
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate PHP success and error semantics without sending mail
        run: python3 tracking-release-20261020/test_handlers.py
      - name: Check consent, conversion semantics, layouts and failed availability
        run: node tracking-release-20261020/check.cjs
      - name: Guard, back up, publish and verify corrected files
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_PUBLIC_KEY: ${{ secrets.SFTP_HOST_PUBLIC_KEY }}
        run: python3 tracking-release-20261020/deploy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-tracking-release-touring-20261020
          path: |
            tracking-qa/
            tracking-rollback/
            tracking-release-20261020/manifest.json
            RELEASE-VERIFIED.json
          retention-days: 90
