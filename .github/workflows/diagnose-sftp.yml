name: Diagnose Touring SFTP (strict timeout)
on:
  push:
    paths:
      - '.github/workflows/diagnose-sftp.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install SSH client library
        run: python -m pip install -q paramiko
      - name: Diagnose socket, host identity, login and directory (read only)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_PUBLIC_KEY: ${{ secrets.SFTP_HOST_PUBLIC_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import os, socket, base64, hashlib, sys
          import paramiko
          h=os.getenv('SFTP_HOST',''); u=os.getenv('SFTP_USER',''); p=os.getenv('SFTP_PASSWORD',''); key=os.getenv('SFTP_HOST_PUBLIC_KEY','')
          for name,value in [('SFTP_HOST',h),('SFTP_USER',u),('SFTP_PASSWORD',p),('SFTP_HOST_PUBLIC_KEY',key)]:
              if not value: print(f'MISSING SECRET: {name}');sys.exit(1)
          print('Secrets: all four present (rerun)',flush=True)
          print('HOST MATCHES PROVIDED IONOS HOST:', h.strip().lower() == 'access-5021325370.webspace-host.com',flush=True)
          try:
              sock=socket.create_connection((h,22),timeout=8)
              print('TCP PORT 22: reachable',flush=True)
          except Exception as e:
              print('TCP PORT 22: FAILED',type(e).__name__,str(e),flush=True);sys.exit(2)
          try:
              parts=key.split()
              if len(parts)==3 and parts[0]==h: parts=parts[1:]
              if len(parts)!=2: raise ValueError('Expected ssh-ed25519 <base64> (or hostname prefix)')
              expected_type,expected_b64=parts
              expected=base64.b64decode(expected_b64)
              t=paramiko.Transport(sock)
              t.banner_timeout=10
              t.auth_timeout=10
              t.start_client(timeout=10)
              actual=t.get_remote_server_key()
              if actual.get_name()!=expected_type or actual.asbytes()!=expected:
                  print('HOST KEY: MISMATCH -- STOPPING',flush=True);sys.exit(3)
              print('HOST KEY: matches configured key (independent fingerprint validation still recommended)',flush=True)
              t.auth_password(username=u,password=p)
              print('AUTHENTICATION: SUCCESS',flush=True)
              sftp=paramiko.SFTPClient.from_transport(t)
              sftp.get_channel().settimeout(10)
              print('SFTP DIRECTORY:',sftp.getcwd() or '/',flush=True)
              print('REMOTE ENTRIES (first 20):',flush=True)
              for name in sftp.listdir('.')[:20]:print(' - '+name,flush=True)
              sftp.close();t.close()
              print('READ-ONLY DIAGNOSTIC: SUCCESS',flush=True)
          except Exception as e:
              print('DIAGNOSTIC FAILURE:',type(e).__name__,str(e),flush=True);sys.exit(4)
          PY
