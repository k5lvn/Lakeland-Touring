name: Touring destination navigation repair
on:
  pull_request:
    paths: ['navigation-fix-20261030/**', '.github/workflows/navigation-fix-20261030.yml']
  push:
    branches: [main]
    paths: ['navigation-fix-20261030/**', '.github/workflows/navigation-fix-20261030.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip -q install beautifulsoup4==4.14.2
      - run: python3 navigation-fix-20261030/release.py
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify mobile and desktop navigation
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$CHROME_BIN"
          node navigation-fix-20261030/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-qa
          path: navigation-qa/
          retention-days: 90
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    concurrency:
      group: lakeland-touring-deployment
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip -q install paramiko==3.5.1 beautifulsoup4==4.14.2
      - name: Back up, publish and verify current public pages
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_PUBLIC_KEY: ${{ secrets.SFTP_HOST_PUBLIC_KEY }}
        run: python3 navigation-fix-20261030/release.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-release-evidence
          path: |
            navigation-qa/
            navigation-rollback/
          retention-days: 90
