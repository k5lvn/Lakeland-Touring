name: Lake District destinations showcase
on:
  push:
    branches: [main]
    paths: ['destinations-release-20261031/**', '.github/workflows/destinations-release-20261031.yml']
permissions:
  contents: read
concurrency:
  group: lakeland-touring-deployment
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact approved artwork
        run: base64 --decode destinations-release-20261031/approved-destinations.png.base64 > destinations-release-20261031/approved-destinations.png
      - run: python3 -m pip -q install beautifulsoup4==4.14.2 paramiko==3.5.1
      - name: Snapshot live pages and validate focused destination update
        run: python3 destinations-release-20261031/release.py
      - name: Persist exact rollback backup before publication
        uses: actions/upload-artifact@v4
        with:
          name: destinations-pre-deployment-backup
          path: destinations-backup/
          retention-days: 90
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Check mobile and desktop cards, image loading and destination links
        run: node destinations-release-20261031/check.cjs
      - name: Publish and verify; restore originals on failure
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST_PUBLIC_KEY: ${{ secrets.SFTP_HOST_PUBLIC_KEY }}
        run: python3 destinations-release-20261031/release.py --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: destinations-release-evidence
          path: |
            destinations-qa/
            destinations-backup/
          retention-days: 90
