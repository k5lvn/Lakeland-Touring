name: Review researched Touring destination guides
on:
  push:
    branches: [touring-destinations-review-20261020]
    paths: ['touring-destination-review/**', '.github/workflows/touring-guide-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node touring-destination-review/check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touring-destination-guide-review
          path: touring-guide-qa/
          retention-days: 90
