name: Validate booking backend candidate
on:
  push:
    branches: ['booking/backend-review-20261020', 'booking/holds-operations-20261021']
    paths: ['booking-backend/**', 'owner-garage/**', '.github/workflows/booking-backend-review.yml']
  pull_request:
    paths: ['booking-backend/**', 'owner-garage/**', '.github/workflows/booking-backend-review.yml']
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check runtime requirements
        run: php -r 'foreach(["pdo_sqlite","curl"] as $e) if(!extension_loaded($e)) exit(1);'
      - name: Lint PHP
        run: find booking-backend owner-garage -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Booking and payment integrity without external calls
        run: php booking-backend/tests/booking.php
      - name: Offline launch configuration and redaction checks
        run: php booking-backend/tests/preflight.php
      - name: Date holds and operational policy
        run: php booking-backend/tests/holds.php
      - name: Concurrent independent-process date selection
        run: python3 booking-backend/tests/concurrency.py
      - name: Frontend race and validation checks
        run: node booking-backend/tests/frontend.cjs
      - name: Real HTTP handlers with private fixture configuration
        run: python3 booking-backend/tests/handlers_http.py
      - name: Install browser QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Owner booking permissions, pricing, audit and phone/desktop journey
        run: python3 owner-garage/test_bookings.py --browser
      - name: Candidate calendar at phone and desktop widths
        run: node booking-backend/tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: booking-hold-review-20261021
          path: booking-review-qa/
          retention-days: 90

